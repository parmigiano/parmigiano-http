name: parmigiano-http

services:
    # ollama_phi:
    #     restart: unless-stopped
    #     image: ollama/ollama
    #     container_name: ollama_phi
    #     ports:
    #         - '11435:11434'
    #     environment:
    #         - OLLAMA_NUM_PARALLEL=2
    #         - OLLAMA_MAX_LOADED_MODELS=1
    #         - OLLAMA_KEEP_ALIVE=10m
    #     volumes:
    #         - ollama_phi_data:/root/.ollama

    libretranslate:
        image: libretranslate/libretranslate
        restart: unless-stopped
        ports:
            - '4512:5000'
        environment:
            - LT_LOAD_ONLY=en,ru
        volumes:
            - lt_data:/app/models
        networks:
            parmigiano:
                aliases:
                    - libretranslate
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    nsfw:
        restart: unless-stopped
        build:
            context: ./nsfw-service
            dockerfile: Dockerfile
        environment:
            PORT: '8081'
            NSFW_THRESHOLD_PORN: '0.6'
            NSFW_THRESHOLD_HENTAI: '0.6'
            NSFW_THRESHOLD_SEXY: '0.8'
        ports:
            - '8081:8081'
        networks:
            parmigiano:
                aliases:
                    - nsfw
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        healthcheck:
            test: ['CMD', 'node', 'healthcheck.js']
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 40s

    profanity:
        restart: unless-stopped
        build:
            context: ./profanity-service
            dockerfile: Dockerfile
        environment:
            PORT: '8082'
            PROFANITY_LANGUAGES: 'en,ru,de,sp'
            PROFANITY_MATCH_THRESHOLD: '0.95'
        ports:
            - '8082:8082'
        networks:
            parmigiano:
                aliases:
                    - profanity
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        healthcheck:
            test: ['CMD', 'python', 'healthcheck.py']
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 15s

    rabbitmq:
        image: rabbitmq:3-management
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            parmigiano:
                aliases:
                    - rabbitmq
        healthcheck:
            test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    http_server:
        restart: always
        build:
            context: http-service
            dockerfile: Dockerfile
        env_file: 'http-service/.env.production'
        volumes:
            - ./http-service/logs:/app/logs
        ports:
            - '8080:8080'
        depends_on:
            rabbitmq:
                condition: service_healthy
            nsfw:
                condition: service_healthy
            profanity:
                condition: service_healthy
            libretranslate:
                condition: service_started
        networks:
            parmigiano:
                aliases:
                    - http-server
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

volumes:
    # ollama_phi_data:
    lt_data:
    rabbitmq_data:

networks:
    parmigiano:
        external: true
        name: parmigiano-net
