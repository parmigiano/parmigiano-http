    http_server:
        restart: always
        build:
            context: http-service
            dockerfile: http-server/Dockerfile
        env_file: 'http-service/http-server/.env'
        volumes:
            - ./http-service/http-server/logs:/app/logs
        expose:
            - '8080'
        depends_on:
            nsfw:
                condition: service_healthy
            profanity:
                condition: service_healthy
            libretranslate:
                condition: service_started
        networks:
            parmigiano:
                aliases:
                    - http-server
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    auth_server:
        restart: always
        build:
            context: http-service
            dockerfile: auth-server/Dockerfile
        env_file: 'http-service/auth-server/.env'
        volumes:
            - ./http-service/auth-server/logs:/app/logs
        expose:
            - '8081'
        depends_on:
            profanity:
                condition: service_healthy
            http_server:
                condition: service_started
        networks:
            parmigiano:
                aliases:
                    - auth-server
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

volumes:
    # ollama_phi_data:
    lt_data:

networks:
    parmigiano:
        external: true
        name: parmigiano-net
