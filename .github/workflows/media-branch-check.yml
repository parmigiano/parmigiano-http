name: Media branch check

on:
  push:
    branches:
      - fix/media-form-upload

permissions:
  contents: read

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Check changed media code
        working-directory: http-service
        run: |
          cppcheck \
            --std=c11 \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --error-exitcode=1 \
            -I include \
            src/handlers/v2/media_handler.c \
            src/handlers/v2/user_handler.c \
            src/s3/s3.c \
            src/utilities/mime.c
