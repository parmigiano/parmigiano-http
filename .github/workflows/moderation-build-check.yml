name: Moderation build check

on:
  push:
    branches:
      - feat/moderation-pipeline

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libpq-dev libcurl4-openssl-dev libssl-dev libargon2-dev \
            uuid-dev libmaxminddb-dev libhiredis-dev libcjson-dev \
            libxml2-dev librabbitmq-dev

      - name: Build and install libs3
        run: |
          git clone --depth 1 https://github.com/bji/libs3.git /tmp/libs3
          make -C /tmp/libs3
          sudo make -C /tmp/libs3 install
          sudo ldconfig

      - name: Build and install libchttpx
        run: |
          git clone --depth 1 https://github.com/netcorelink/libchttpx.git /tmp/libchttpx
          make -C /tmp/libchttpx libchttpx.so
          sudo make -C /tmp/libchttpx lib-install DESTDIR=
          sudo ldconfig

      - name: Build HTTP service
        id: build
        working-directory: http-service
        run: |
          set +e
          make clean
          make lin > ../moderation-build.log 2>&1
          status=$?
          cat ../moderation-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist compiler output on failure
        if: steps.build.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add moderation-build.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: capture moderation build failure"
            git push
          fi
          exit 1
