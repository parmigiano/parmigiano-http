name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck (http-server)
        working-directory: http-service/http-server
        run: |
          cppcheck \
            --std=c11 \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --error-exitcode=1 \
            -I include \
            -I ../share/postgres/include \
            -I ../share/redis/include \
            -I ../share/cron/include \
            src/ include/ ../share/postgres/src ../share/postgres/include ../share/redis/src ../share/redis/include ../share/cron/src ../share/cron/include

      - name: Run cppcheck (auth-server)
        working-directory: http-service/auth-server
        run: |
          # cppcheck 2.13 miscounts snprintf arguments when PRIu64 is
          # concatenated into a runtime format string in auth_handler.c.
          cppcheck \
            --std=c11 \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=wrongPrintfScanfArgNum:src/handlers/v2/auth_handler.c \
            --inline-suppr \
            --error-exitcode=1 \
            -I include \
            -I ../share/postgres/include \
            -I ../share/redis/include \
            src/ include/

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JSON files
        run: |
          python3 -m json.tool http-service/http-server/src/infra/locale/en.json >/dev/null
          python3 -m json.tool http-service/http-server/src/infra/locale/ru.json >/dev/null
          python3 -m json.tool http-service/http-server/docs/swagger/swagger_v2.json >/dev/null
          python3 -m json.tool http-service/auth-server/src/infra/locale/en.json >/dev/null
          python3 -m json.tool http-service/auth-server/src/infra/locale/ru.json >/dev/null
          python3 -m json.tool http-service/auth-server/docs/swagger/swagger_v2.json >/dev/null

      - name: Check for committed secrets and build artifacts
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..+|.*\.(pem|key|p12|pfx))$' | grep -v -E '(^|/)\.env\.example$'; then
            echo "Sensitive environment/key file is tracked by git"
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.out|\.build)/'; then
            echo "Build artifacts are tracked by git"
            exit 1
          fi

  migration-policy:
    name: Migration policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate migration names and order
        shell: bash
        run: |
          set -euo pipefail

          dir="http-service/share/postgres/migrations"
          mapfile -t migrations < <(find "$dir" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)

          if (( ${#migrations[@]} == 0 )); then
            echo "No migrations found"
            exit 1
          fi

          previous=0
          for migration in "${migrations[@]}"; do
            if [[ ! "$migration" =~ ^([0-9]{3})_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $migration"
              exit 1
            fi

            version=$((10#${BASH_REMATCH[1]}))
            if (( version <= previous )); then
              printf 'Migration order error: version %03d must be greater than %03d (%s)\n' "$version" "$previous" "$migration"
              exit 1
            fi

            if [[ ! -s "$dir/$migration" ]]; then
              echo "Empty migration: $migration"
              exit 1
            fi

            previous=$version
          done

      - name: Prevent editing applied migration history
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          migration_dir="http-service/share/postgres/migrations/"
          legacy_migration_dir="http-service/http-server/src/storage/postgres/migrations/"
          git fetch origin "$BASE_REF" --depth=1

          base="origin/$BASE_REF"
          mapfile -t applied_migrations < <(
            git ls-tree -r --name-only "$base" -- "$migration_dir" "$legacy_migration_dir" |
              awk '/\.sql$/' |
              sort
          )

          declare -A applied_names=()
          highest_applied_version=0
          violations=()

          for base_path in "${applied_migrations[@]}"; do
            filename=${base_path##*/}
            current_path="${migration_dir}${filename}"
            applied_names["$filename"]=1

            version=${filename%%_*}
            version=$((10#$version))
            if (( version > highest_applied_version )); then
              highest_applied_version=$version
            fi

            if [[ ! -f "$current_path" ]]; then
              violations+=("deleted: $filename")
              continue
            fi

            base_hash=$(git rev-parse "$base:$base_path")
            current_hash=$(git hash-object "$current_path")
            if [[ "$base_hash" != "$current_hash" ]]; then
              violations+=("modified: $filename")
            fi
          done

          for current_path in "$migration_dir"*.sql; do
            filename=${current_path##*/}
            if [[ -n "${applied_names[$filename]+x}" ]]; then
              continue
            fi

            version=${filename%%_*}
            version=$((10#$version))
            if (( version <= highest_applied_version )); then
              violations+=("new migration must follow version $(printf '%03d' "$highest_applied_version"): $filename")
            fi
          done

          if (( ${#violations[@]} > 0 )); then
            echo "Existing migrations are immutable. Add a new migration instead:"
            printf '  %s\n' "${violations[@]}"
            exit 1
          fi
